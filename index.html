<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon & So</title>
  <style>
    /* Reset some default browser styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40px;
      color: #222;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      max-width: 600px;
    }

    .button {
      background-color: #4a90e2;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #357ABD;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="logo">Moon & So</div>

  <h1>Welcome to Moon & So</h1>
  <p>Your journey to find the perfect style and shine starts here. Discover curated selections just for you.</p>
  <a href="#" class="button">Explore Now</a>

  <footer>
    &copy; 2025 Moon & So. All rights reserved.
  </footer>

</body>
</html>
